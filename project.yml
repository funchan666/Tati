name: Tati
options:
  bundleIdPrefix: com.tati
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    from: 5.10.0
targets:
  Tati:
    dependencies:
      - package: Alamofire
    entitlements:
      path: Tati/Tati.entitlements
      properties:
        aps-environment: $(TABLE_PUSH_ENVIRONMENT)
    type: application
    platform: iOS
    sources:
      - path: Tati
        excludes:
          - Resources
      - path: Tati/Resources
        buildPhase: resources
    settings:
      base:
        TABLE_PUSH_ENVIRONMENT: development
        PRODUCT_BUNDLE_IDENTIFIER: com.tati.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          TABLE_PUSH_ENVIRONMENT: production
    info:
      path: Tati/Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans, es, fr, de, ja]
        UIAppFonts: [DMSans-Regular.ttf, DMSans-SemiBold.ttf, Fraunces-SemiBold.ttf]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.tati.app]
        NSPhotoLibraryUsageDescription: Choose a photo or food video to share in Tati.
        CFBundleDisplayName: Tati
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Tati uses the camera to take your profile photo and show a camera preview when you prepare a food live room or video call.
        NSMicrophoneUsageDescription: Speak a message in a food room and review the text before sending.
        NSSpeechRecognitionUsageDescription: Tati turns spoken food-room messages into editable text. If speech cannot be processed on your device, audio is sent to Apple for recognition.
schemes:
  Tati:
    build:
      targets:
        Tati: all
    run:
      config: Debug
    archive:
      config: Release
