name: Tati
options:
  bundleIdPrefix: com.tati
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Tati:
    type: application
    platform: iOS
    sources:
      - path: Tati
        excludes:
          - Resources
      - path: Tati/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tati.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Tati/Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans, es, fr, de, ja]
        CFBundleDisplayName: Tati
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Tati uses the camera when you choose to preview yourself for a video call or prepare a live session.
        NSMicrophoneUsageDescription: Tati uses your microphone for voice input and when you choose to start a call.
        NSSpeechRecognitionUsageDescription: Tati turns your speech into an editable message. Audio may be sent to Apple for recognition when on-device recognition is unavailable.
        NSPhotoLibraryUsageDescription: Choose your own profile photos and food videos for Tati.
schemes:
  Tati:
    build:
      targets:
        Tati: all
    run:
      config: Debug
    archive:
      config: Release
